[project]
name = "ordonnancement"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.19.6",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "pydantic>=2.12.5",
    "polars>=1.37.1",
    "rich>=14.2.0",
    "typer>=0.12",
]

[project.scripts]
ordonnancement = "ordonnancement.cli:app"
ordonnancement-interface = "ordonnancement.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordonnancement"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.4",
    "ty>=0.0.1a6",
]

[tool.pytest.ini_options]
addopts = "--cov=ordonnancement --cov-report=term-missing"
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "ordonnancement",
]
